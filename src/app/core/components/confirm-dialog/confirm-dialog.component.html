@if (options; as opt) {
  <div class="confirm-backdrop" (click)="onBackdropClick($event)" (keydown)="onKeydown($event)">
    <div
      #dialog
      class="confirm-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="opt.title || opt.message"
    >
      @if (opt.title) {
        <h2 class="confirm-dialog__title">{{ opt.title }}</h2>
      }
      <p class="confirm-dialog__message">{{ opt.message }}</p>

      <div class="confirm-dialog__actions">
        <button type="button" class="confirm-btn confirm-btn--secondary" (click)="onCancel()">
          {{ opt.cancelLabel || ('common.cancel' | translate) }}
        </button>
        <button
          type="button"
          data-confirm
          class="confirm-btn"
          [class.confirm-btn--danger]="opt.danger"
          [class.confirm-btn--primary]="!opt.danger"
          (click)="onConfirm()"
        >
          {{ opt.confirmLabel || ('common.confirm' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
