<div class="theme-toggle-wrapper">
  <button
    class="theme-toggle-btn"
    (click)="toggleDropdown()"
    [attr.aria-label]="'theme.toggle' | translate"
    [attr.aria-expanded]="isDropdownOpen">
    <app-icon [name]="getThemeIcon()" class="theme-icon"></app-icon>
    <app-icon name="keyboard_arrow_down" class="arrow" [class.open]="isDropdownOpen"></app-icon>
  </button>

  <div class="theme-dropdown" [class.open]="isDropdownOpen">
    @for (theme of themes; track theme.value) {
      <button
        class="theme-option"
        [class.active]="(theme$ | async) === theme.value"
        (click)="selectTheme(theme.value)"
        [attr.aria-label]="theme.labelKey | translate">
        <app-icon [name]="theme.icon" class="option-icon"></app-icon>
        <span class="option-label">{{ theme.labelKey | translate }}</span>
        @if ((theme$ | async) === theme.value) {
          <app-icon name="check" class="check-icon"></app-icon>
        }
      </button>
    }
  </div>
</div>
