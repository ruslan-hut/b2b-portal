<div class="chat-container" [class.mobile-show-chat]="mobileShowChat">
  <aside class="chat-sidebar">
    <app-chat-list
      [chats]="(chats$ | async) || []"
      [activeChat]="activeChat ? { platform: activeChat.platform, userId: activeChat.userId } : null"
      [hasMoreChats]="chatService.hasMoreChats"
      [showUnreadOnly]="chatService.unreadOnly"
      [loadingUnread]="chatService.loadingUnread"
      (selectChat)="onSelectChat($event)"
      (loadMore)="onLoadMoreChats()"
      (toggleUnread)="onToggleUnread()"
      (markAllRead)="onMarkAllRead()"
    ></app-chat-list>
  </aside>
  <section class="chat-main">
    <app-chat-window
      [messages]="messages"
      [activeChat]="activeChat"
      [loading]="loading"
      [typingIndicator]="typingIndicator"
      [wsConnected]="wsConnected"
      [errorMessage]="sendFileError"
      (loadMore)="onLoadMore()"
      (sendMessage)="onSendMessage($event)"
      (sendFiles)="onSendFiles($event)"
      (goBack)="onGoBack()"
      (dismissError)="sendFileError = ''"
    ></app-chat-window>
  </section>
</div>
